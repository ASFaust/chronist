name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # reused by publish.yml

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is past end-of-life and no longer on the runner image; uv provides it.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest -q -n auto
