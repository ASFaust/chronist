name: publish

# Publishing a GitHub Release (tag vX.Y.Z matching chronist.__version__)
# tests, builds and uploads to PyPI via trusted publishing (no API token).

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('chronist/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version, release tag: $GITHUB_REF_NAME"
          test "$version" = "$tag" || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chronist
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
