name: publish

# Every push to main: test -> next version -> build -> PyPI -> tag + GitHub Release.
#
#   patch bump by default; "[minor]" or "[major]" in any pushed commit message
#   bumps more; "[skip release]" publishes nothing (tests still run).
#   Manual runs (Actions tab -> publish -> Run workflow) can pick the bump.
#
# The tag is pushed only after PyPI accepted the upload, so a failed publish
# leaves no tag behind and the next push retries the same version.
# PyPI trusted publishing is bound to this file name and the "pypi" environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        env:
          # all commit messages of this push (env, not inline: no shell injection)
          COMMIT_MESSAGE: ${{ join(github.event.commits.*.message, ' ') }}
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          head=$(git tag --points-at HEAD --list 'v[0-9]*' | head -1)
          python3 .github/scripts/next_version.py "$last" "$head" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build sdist and wheel
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION"   # local only; setuptools-scm reads it
          uv build
          uvx twine check --strict dist/*
          ls dist | grep -q -- "-$VERSION-py3-none-any.whl" || { echo "::error::built version is not $VERSION"; ls dist; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chronist
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag, create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" dist/* --title "chronist $VERSION" --generate-notes --verify-tag
